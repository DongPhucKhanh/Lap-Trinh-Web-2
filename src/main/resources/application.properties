# =============================================
# SERVER CONFIGURATION
# =============================================
server.port=8080

# =============================================
# DATABASE CONFIGURATION (Laragon / MySQL)
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/db_anvat?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / HIBERNATE CONFIGURATION
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =============================================
# JWT CONFIGURATION
# =============================================
# Secret key (must be at least 256 bits / 32 chars for HMAC-SHA256)
jwt.secret=dongphuckhanh_ltw2_secret_key_chuoi_nay_can_du_dai_de_bao_mat_256bit
# Expiration: 24 hours = 86400000 ms
jwt.expiration=86400000

# =============================================
# FILE UPLOAD CONFIGURATION
# =============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Thư mục lưu file upload (relative to project root)
app.upload.dir=src/main/resources/static/uploads

# =============================================
# SPRINGDOC / SWAGGER CONFIGURATION
# =============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# =============================================
# LOGGING
# =============================================
logging.level.org.springframework.security=DEBUG
logging.level.com.dongphuckhanh.ltw2=DEBUG